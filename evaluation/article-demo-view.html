<div id="thresher-article-comparison">
  <div class="viz-controls">
    <label class="form-label">비교할 문단
      <select class="form-select" id="thresher-paragraph">__OPTIONS__</select>
    </label>
  </div>
  <div class="nav nav-pills" role="tablist" aria-label="기사 비교 방식">
    <button class="nav-link" id="thresher-before-tab" role="tab" aria-controls="thresher-before-panel" aria-selected="false" type="button">적용 전</button>
    <button class="nav-link active" id="thresher-diff-tab" role="tab" aria-controls="thresher-diff-panel" aria-selected="true" type="button">변경 표시</button>
    <button class="nav-link" id="thresher-after-tab" role="tab" aria-controls="thresher-after-panel" aria-selected="false" type="button">적용 후</button>
  </div>
  <div id="thresher-before-panel" role="tabpanel" aria-labelledby="thresher-before-tab" hidden>
    <p id="thresher-before-text">__BEFORE__</p>
  </div>
  <div id="thresher-diff-panel" role="tabpanel" aria-labelledby="thresher-diff-tab">
    <div class="text-small">적용 전 · <del>삭제하거나 바꾼 부분</del></div>
    <p id="thresher-before-marked">__BEFORE_MARKED__</p>
    <div id="thresher-after-legend" class="text-small">적용 후 · <ins>새로 쓴 부분</ins></div>
    <p id="thresher-after-marked">__AFTER_MARKED__</p>
  </div>
  <div id="thresher-after-panel" role="tabpanel" aria-labelledby="thresher-after-tab" hidden>
    <p id="thresher-after-text">__AFTER__</p>
  </div>
  <div id="thresher-reason" role="status" aria-live="polite">__REASON__</div>
  <hr>
  <div class="text-small text-muted tabular-nums">__METRICS__</div>
  <div class="text-small text-muted">공백 포함 · 제목과 줄바꿈 제외 · 동일 에이전트의 편집 시연</div>
</div>
<style>
  #thresher-article-comparison { color:var(--foreground); }
  #thresher-article-comparison [role="tabpanel"] { padding-block:16px 8px; }
  #thresher-article-comparison [role="tabpanel"] p { margin:0; word-break:keep-all; overflow-wrap:anywhere; }
  #thresher-article-comparison #thresher-before-marked,
  #thresher-article-comparison #thresher-after-marked { margin-top:8px; }
  #thresher-article-comparison #thresher-after-legend { margin-top:20px; }
  #thresher-article-comparison del { color:var(--foreground); background:color-mix(in srgb, var(--red) 14%, transparent); text-decoration:line-through; }
  #thresher-article-comparison ins { color:var(--foreground); background:color-mix(in srgb, var(--green) 14%, transparent); text-decoration:underline; text-underline-offset:3px; }
  #thresher-article-comparison #thresher-reason { margin-block:12px; }
</style>
<script type="application/json" id="thresher-comparison-data">__DATA__</script>
<script>
(() => {
  const root = document.getElementById('thresher-article-comparison');
  const data = JSON.parse(document.getElementById('thresher-comparison-data').textContent);
  const picker = root.querySelector('#thresher-paragraph');
  const original = root.querySelector('#thresher-before-text');
  const revised = root.querySelector('#thresher-after-text');
  const beforeMarked = root.querySelector('#thresher-before-marked');
  const afterMarked = root.querySelector('#thresher-after-marked');
  const reason = root.querySelector('#thresher-reason');
  picker.addEventListener('change', () => {
    const row = data.rows[Number(picker.value)];
    original.textContent = row.before;
    revised.textContent = row.after;
    beforeMarked.innerHTML = row.before_html;
    afterMarked.innerHTML = row.after_html;
    reason.textContent = row.short_reason;
  });
})();
</script>
